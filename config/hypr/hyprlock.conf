# Minimal lock screen.
# Visual structure: centered date/time, optional avatar, compact password field.

$cache = $HOME/.cache/hyprland-lite

source = colors-hyprlock.conf

general {
    ignore_empty_input = true
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = $cache/lockscreen.png
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.95
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.1
}

label {
    monitor =
    text = cmd[update:1000] date +"%A"
    color = $text
    font_size = 52
    font_family = Fira Sans Semibold
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $background_dim
}

label {
    monitor =
    text = cmd[update:60000] date +"%d %B"
    color = $text_secondary
    font_size = 20
    font_family = Fira Sans Semibold
    position = 0, 162
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $background_dim
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_secondary
    font_size = 14
    font_family = Fira Sans Semibold
    position = 0, 132
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $background_dim
}

image {
    monitor =
    path = $HOME/.face
    size = 78
    rounding = -1
    border_size = 2
    border_color = $accent
    position = 0, 42
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = $background_dim
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 13
    font_family = Fira Sans Semibold
    position = 0, -32
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 42
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = $border
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    rounding = 20
    check_color = $accent
    fail_color = $error
    fail_text = Authentication failed
    capslock_color = $warning
    numlock_color = $warning
    bothlock_color = $warning
    position = 0, -84
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = $background_dim
}

label {
    monitor =
    text = cmd[update:1000] capacity="$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n 1)"; [ -n "$capacity" ] && echo "$capacity%"
    color = $text_secondary
    font_size = 12
    font_family = Fira Sans Semibold
    position = -28, 24
    halign = right
    valign = bottom
}
